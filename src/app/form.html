<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <form action="" (submit)="onSubmit($event)"> <!--Event biding -> quando há uma ação, chama algo no componente-->
    <label>
        Email:
        <input type="email" [formField]="loginForm.email"> <!--Data Biding: sincroniza dados entre o componente e template-->
        
        @if (loginForm.email().touched() && loginForm.email().invalid()) {
            <ul>
                @for (error of loginForm.email().errors(); track error) {
                <li>{{ error.message }}</li>
                }
            </ul>
        }
    </label>
    <label for="">
        Senha:
        <input type="password" [formField]="loginForm.password">

        @if (loginForm.password().touched() && loginForm.password().invalid()) {
            @for (error of loginForm.password().errors(); track error) {
                <p>{{ error.message }}</p>
            }
        }
    </label>

    <button type="submit" >Entrar</button>
   </form>
</body>
</html>
<!--
Two way biding:

Do template para o componente: quando o usuário altera um valor no input, a propriedade no componente é atualizada automaticamente
Do componente para o template: quando a propriedade no componente muda, o template é atualizado automaticamente
-->

<!--
Caso a variavel esteja vazia:

@for (item of items; track item.name) {
  <li>{{ item.name }}</li>
} @empty {
  <li>There are no items.</li>
}

-->
